# Localization Factor Graph Backend - Regression Gate Thresholds
# Generated from acceptance baseline (2026-04-26).
# Values include ~20-30% headroom above measured p95.
#
# Usage:
#   python3 scripts/check_localization_fg_gate.py \
#     --result-json perf_reports/results/.../result.json \
#     --thresholds perf_reports/baselines/localization/fg_gate_thresholds.yaml

missions:
  trackdrive:
    min_samples: 40
    max_position_p95_m: 1.0
    max_heading_p95_deg: 11.0
    max_velocity_p95_mps: 0.10
    max_time_diff_p95_s: 0.15
  autocross:
    min_samples: 40
    max_position_p95_m: 1.0
    max_heading_p95_deg: 11.0
    max_velocity_p95_mps: 0.10
    max_time_diff_p95_s: 0.15
  acceleration:
    min_samples: 40
    max_position_p95_m: 0.8
    max_heading_p95_deg: 12.0
    max_velocity_p95_mps: 0.10
    max_time_diff_p95_s: 0.15
  skidpad:
    min_samples: 40
    max_position_p95_m: 1.6
    max_heading_p95_deg: 17.0
    max_velocity_p95_mps: 0.10
    max_time_diff_p95_s: 0.15
