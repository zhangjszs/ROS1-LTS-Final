name: localization-regression-ci

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "perf_reports/scripts/**"
      - "src/localization_core/**"
      - "src/localization_ros/**"
      - ".github/workflows/localization_regression_ci.yaml"

jobs:
  localization-tools-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Verify tooling files exist
        run: |
          test -f perf_reports/scripts/compare_backends.py
          test -f perf_reports/scripts/inject_scenario.py
          test -f perf_reports/scripts/localization_health_check.sh
          test -f perf_reports/scripts/localization_log_check.sh
          test -f perf_reports/scripts/cone_gt_annotator.py

      - name: Python syntax check
        run: |
          python3 -m py_compile perf_reports/scripts/compare_backends.py
          python3 -m py_compile perf_reports/scripts/inject_scenario.py
          python3 -m py_compile perf_reports/scripts/cone_gt_annotator.py

      - name: Run localization tooling unit tests
        run: |
          python3 perf_reports/scripts/test_localization_validation_tools.py

      - name: Verify FG gate assets exist
        run: |
          test -f scripts/check_localization_fg_gate.py
          test -f perf_reports/baselines/localization/fg_gate_thresholds.yaml

      - name: FG gate checker syntax check
        run: |
          python3 -m py_compile scripts/check_localization_fg_gate.py

      - name: FG gate checker logic test (mock pass)
        run: |
          mkdir -p /tmp/fg_gate_test
          cat > /tmp/fg_gate_test/mock_pass.json <<'JSON'
          {
            "mission": "autocross",
            "status": "PASS",
            "samples": 100,
            "metrics": {
              "pos_error_p95_m": 0.5,
              "heading_error_p95_deg": 5.0,
              "velocity_error_p95_mps": 0.03,
              "time_diff_p95_s": 0.05
            }
          }
          JSON
          python3 scripts/check_localization_fg_gate.py \
            --result-json /tmp/fg_gate_test/mock_pass.json \
            --thresholds perf_reports/baselines/localization/fg_gate_thresholds.yaml \
            --output-json /tmp/fg_gate_test/pass_result.json \
            --output-md /tmp/fg_gate_test/pass_result.md
          grep '"overall_status": "pass"' /tmp/fg_gate_test/pass_result.json

      - name: FG gate checker logic test (mock fail)
        run: |
          cat > /tmp/fg_gate_test/mock_fail.json <<'JSON'
          {
            "mission": "skidpad",
            "status": "PASS",
            "samples": 100,
            "metrics": {
              "pos_error_p95_m": 2.0,
              "heading_error_p95_deg": 20.0,
              "velocity_error_p95_mps": 0.03,
              "time_diff_p95_s": 0.05
            }
          }
          JSON
          if python3 scripts/check_localization_fg_gate.py \
            --result-json /tmp/fg_gate_test/mock_fail.json \
            --thresholds perf_reports/baselines/localization/fg_gate_thresholds.yaml \
            --output-json /tmp/fg_gate_test/fail_result.json \
            --output-md /tmp/fg_gate_test/fail_result.md; then
            echo "ERROR: expected failure but got success"
            exit 1
          fi
          grep '"overall_status": "fail"' /tmp/fg_gate_test/fail_result.json
          echo "[OK] mock fail correctly triggered"
