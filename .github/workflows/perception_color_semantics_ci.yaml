name: perception-color-semantics-ci

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/check_color_semantics_regression_mode.sh"
      - "scripts/check_perception_regression_mode.sh"
      - "perf_reports/scripts/evaluate_color_semantics_metrics.py"
      - "perf_reports/baselines/perception/*.color_semantics.thresholds.env"
      - "src/perception_ros/test/test_mainline_adapter_launch_contract.py"
      - ".github/workflows/perception_color_semantics_ci.yaml"
  pull_request:
    paths:
      - "scripts/check_color_semantics_regression_mode.sh"
      - "scripts/check_perception_regression_mode.sh"
      - "perf_reports/scripts/evaluate_color_semantics_metrics.py"
      - "perf_reports/baselines/perception/*.color_semantics.thresholds.env"
      - "src/perception_ros/test/test_mainline_adapter_launch_contract.py"
      - ".github/workflows/perception_color_semantics_ci.yaml"

concurrency:
  group: color-semantics-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  color-semantics-gate:
    runs-on: ubuntu-20.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Verify gate assets exist
        run: |
          test -f scripts/check_color_semantics_regression_mode.sh
          test -f scripts/check_perception_regression_mode.sh
          test -f perf_reports/scripts/evaluate_color_semantics_metrics.py
          for mode in track accel skidpad; do
            test -f "perf_reports/baselines/perception/${mode}.color_semantics.thresholds.env"
          done

      - name: Shell syntax checks
        run: |
          bash -n scripts/check_color_semantics_regression_mode.sh
          bash -n scripts/check_perception_regression_mode.sh

      - name: Python syntax checks
        run: |
          python3 -m py_compile perf_reports/scripts/evaluate_color_semantics_metrics.py

      - name: Run launch contract unit tests
        timeout-minutes: 8
        run: |
          python3 -m unittest src/perception_ros/test/test_mainline_adapter_launch_contract.py
