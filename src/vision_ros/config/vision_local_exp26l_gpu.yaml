# Local override for exp26l_gpu (classes: 0=cone_red, 1=cone_blue, 2=cone_yellow)
# Vision outputs unified YELLOW (1), size classification done by LiDAR
inference:
  backend_type: "onnx"
  model_path: "/home/kerwin/2025huat/src/vision_ros/models/exp26l_gpu/best.onnx"
  # class_id -> color enum (0:BLUE, 1:YELLOW, 2:RED, 3:YELLOW_BIG, 4:NONE)
  # Note: Vision outputs unified YELLOW (1), LiDAR classifies by size into YELLOW_SMALL/YELLOW_BIG
  class_to_color: [3, 0, 1]  # [red->RED(3), blue->BLUE(0), yellow->YELLOW(1)]
