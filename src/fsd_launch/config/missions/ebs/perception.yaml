# EBS mission overlay (perception)
# Loaded after lidar_<mode>.yaml and before vehicle overlay.
# Current phase: interface reservation + bag validation.

roi:
  # Use custom ROI for EBS straight-line safety corridor.
  mode: custom
  custom:
    x_min: 0.0
    x_max: 25.0
    y_min: -4.0
    y_max: 4.0

# Keep road_type consistent with track-like pipeline fallback.
road_type: 3

# EBS typically focuses on near-field braking trigger; disable heavy temporal logic by default.
confidence:
  track_semantic:
    enable: false

tracker:
  enable: false

topology:
  enable: false

# Obstacle height filter for EBS emergency braking trigger
# Filters out ground-level noise while preserving actual obstacles
filters:
  obstacle_height:
    enable: true
    # Height range for valid obstacles [m]
    # Default: 0.05-0.5m (typical cone height range)
    min_height: 0.05
    max_height: 0.50
    # Additional gating parameters for EBS target set
    # Note: Fine-tune based on actual EBS target obstacle characteristics
    min_points: 3  # Minimum points to consider as valid obstacle
