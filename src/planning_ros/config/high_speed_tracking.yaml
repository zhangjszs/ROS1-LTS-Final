# I/O Topics
input_cones_topic:              "localization/cone_map"                 #用于接收锥筒
input_pose_topic:               "localization/car_state"                #用于接受车身位姿消息
output_pathlimits_topic:        "planning/pathlimits"          #主链路统一路径输出话题（Planning -> Control 单一真值）
stop_topic:                     "planning/high_speed_tracking/stop"     #发布车辆停止信号

# Visualization data
publish_viz_data:              false   # bool   [-]   兼容侧通道：内部可视化数据发布（默认关闭，主链路已解耦）
viz_topic:                     "planning/high_speed_tracking/viz"                   # visualization data output

## Params

# stop
number_of_stopped_turns:        3       # int    [-]   增加到3圈，确保有足够数据建立完整地图
wait_full_before_stop:          true    # bool   [-]   恢复为 true：等待完整路径
finish_grace_frames:            600     # int    [frame] 增加延迟停车帧数到600
enable_loop_fallback_by_lap_counter: true # bool [-]   几何回环未触发时，按圈计数触发 full 发布兜底
loop_fallback_min_laps:         2       # int    [lap]  2圈后触发兜底
debug_save_way_files:           false   # bool   [-]   调试开关：是否把路径写入testData与loops文件（默认关闭）

# finish zone
finish_zone_x_threshold:         1.0     # double [m]   恢复终点区域 x 坐标阈值
finish_zone_y_threshold:         1.0     # double [m]   恢复终点区域 y 坐标阈值

# path
    # 通过不同的x传出不同的类型路径,供不同种类的控制模块使用,插值都是线性的,默认为0模式
    # 0：获取全部的全局坐标系下的路径
    # 1：对车到下一目标点中间进行插值
    # 2：局部路径插值
    # 3：全路径插值
    # 4：局部路径插值(局部坐标)
    # 5：全路径插值(局部坐标)
    # 6：局部坐标系下的路径
    # 注：4/5 当前会兼容回退到 2/3（本仓库未实现独立的局部坐标插值函数）
the_mode_of_partial_path:       2       # int    [-]   选择发布路径的方式(未回环)
the_mode_of_full_path:          3       # int    [-]   选择发布路径的方式(已回环)

# Filtering
min_cone_confidence:            0.45    # float  [-]   降低置信度阈值，让更多锥桶参与规划
min_cone_confidence_far_front_center: 0.50 # float [-]  降低前向窄带远距阈值
far_front_center_dist_threshold: 20.0  # double [m]   增加前向窄带远距阈值
far_front_center_abs_y_threshold: 1.5  # double [m]   增加前向窄带阈值
min_cone_confidence_far_side:   0.45    # float  [-]   降低远距侧向阈值
min_cone_confidence_far_side_strict: 0.50 # float [-]  降低远距极侧向阈值
far_side_dist_threshold:        16.0    # double [m]   远距分段阈值：x>=0 且 dist>=该值才启用 far_side 阈值
far_side_abs_y_threshold:       1.2     # double [m]   侧向分段阈值：|y|>该值才启用 far_side 阈值
far_side_abs_y_strict_threshold: 8.0  # double [m]   极侧向阈值：|y|>该值时使用 strict 置信度阈值
cone_geom_filter_enable:        false   # bool   [-]   禁用几何过滤，让更多锥桶参与规划
cone_geom_filter_dist_th:       20.0    # double [m]   dist>=该值才启用几何过滤
cone_geom_filter_abs_y_max:     12.0    # double [m]   增加远距 cone 最大允许 |y|
cone_geom_filter_front_only:    true    # bool   [-]   仅对前向(x>=0) cone 应用几何过滤
tracklimits_filter_enable:      false   # bool   [-]   禁用轨道边界过滤
tracklimits_filter_dist_th:     18.0    # double [m]   仅对远距 cone 应用过滤
tracklimits_filter_abs_y_max:   12.0    # double [m]   增加远距 tracklimits 最大允许 |y|
tracklimits_filter_front_only:  true    # bool   [-]   仅对前向(x>=0) cone 应用过滤
max_triangle_edge_len:          8.5     # double [m]   过滤掉有边长大于此值的三角形
min_triangle_angle:             0.24    # double [-]   内角小于此值的三角形被删除(弧度制)
max_dist_circum_midPoint:       1.0     # double [m]   中点与三角形外接圆心之间的最大距离限制,超过此限制会被删除

# Search
max_way_horizon_size:           0       # int    [num] 车前方路径点的最大值,0等于无穷,也就是有多少就找多少路径点
max_search_tree_height:         10      # int    [num] 增加树搜索最大值，提高可行路径覆盖
search_radius:                  6.0     # double [m]   增加搜索路径半径
edge_len_diff_factor:           0.5     # double [-]   边长相对均匀约束（track标准: 0.5）
max_angle_diff:                 0.6     # double [rad] 角度差约束（track标准: 0.6 rad ≈ 34°）
max_search_options:             4       # int    [num] 每节点最大分支数（收紧到3以减少噪声引入）
max_next_heuristic:             3.0     # double [-]   启发值门槛（track标准: 3.0）
heur_dist_ponderation:          0.4     # float  [-]   范围( 0.0,  1.0)计算启发值的时候给长度的权重
heur_lateral_penalty_weight:   0.10     # double [-]   远距侧向(y大)启发式惩罚权重（0=关闭）
heur_lateral_penalty_dist_th:  16.0    # double [m]   dist>=该值才启用侧向惩罚
heur_lateral_penalty_abs_y_threshold: 12.0 # double [m] |y|超过该阈值才产生惩罚
allow_intersection:             false   # bool   [-]   是否允许路径交叉(路径中的循环)
max_treeSearch_time:            0.14    # float  [s]   树搜索最大耗时（换取更稳定的路径；超时会截断搜索）

# Loop Closure                  #这个应该不用怎么碰,关于圈数和关闭节点是用的另外的判定方式
shutdown_on_loop_closure:       false   # bool   [-]   路线闭环之后是否关闭节点
max_dist_loop_closure:          3.0     # double [m]   增大回环判定距离阈值，更容易触发回环
max_angle_diff_loop_closure:    0.8     # double [rad] 增大角度差阈值，更容易触发回环

# Speed Profile (P1)
speed_cap_safe:                 11.11   # double [m/s] SAFE_LAP 速度上限（约 40 km/h）
speed_cap_fast:                 14.0    # double [m/s] FAST_LAP 速度上限（约 50.4 km/h）
max_lateral_acc:                6.5     # double [m/s^2] 曲率限速使用的横向加速度上限
max_accel:                      2.5     # double [m/s^2] 前向积分加速度上限
max_brake:                      4.0     # double [m/s^2] 后向积分制动上限（正值）
min_speed:                      1.0     # double [m/s] 最低巡航速度，避免低速抖动
curvature_epsilon:              0.001   # double [1/m] 曲率限速分母下限
mode_transition_frames:         40      # int    [frame] SAFE_LAP/FAST_LAP 速度上限渐进过渡帧数
curvature_limit:                0.222   # double [1/m] AUT 几何曲率参考上限（R>=4.5m）
curvature_warn_limit_scale:     1.06    # double [-]   告警/质量判定容差倍率（仅用于告警统计，不改变速度约束的曲率值）
curvature_smoothing_enable:     true    # bool   [-]   对输出路径做轻量曲率平滑
curvature_smoothing_max_iters:  15      # int    [iter] 曲率平滑最大迭代次数（抑制局部尖角/抖动）
curvature_smoothing_alpha:      0.45    # double [-]   平滑步长（更强的拉回力度）
curvature_warn_ratio:           0.15    # double [-]   超限点比例达到该阈值才告警（更敏感，优先hold稳定路径）
curvature_warn_min_points:      5       # int    [num] 超限点最小数量门槛
min_publish_path_size:          5       # int    [num] 进一步降低可发布路径最小点数
short_path_stable_relax_points: 2       # int    [num] 进一步降低已有稳定路径时的短路径阈值放宽点数
hold_last_valid_path:           true    # bool   [-]   短路径时保留上次有效路径
hold_last_valid_max_frames:     80      # int    [frame] 增加最多连续保留帧数
loop_close_debounce_frames:     1       # int    [frame] 回环成立防抖帧数，几何回环一旦成立立即切到 FAST_LAP
loop_open_debounce_frames:      30      # int    [frame] 增加回环失效防抖帧数，更稳定
loop_allow_reopen:              true    # bool   [-]   改为 true：允许重新打开回环
mode_min_hold_frames:           20      # int    [frame] 减少模式切换驻留帧数
search_adaptive_enable:         true    # bool   [-]   启用短路径自适应搜索（放宽 search_radius / max_next_heuristic）
search_adaptive_trigger_frames: 1       # int    [frame] 连续短路径达到该帧数后开始放宽搜索参数
search_adaptive_step_frames:    1       # int    [frame] 每累计该帧数，放宽等级 +1
search_adaptive_max_level:      12      # int    [-]   增加放宽等级上限
search_adaptive_bootstrap_level: 5      # int    [-]   增加基础放宽等级
search_adaptive_radius_step:    4.0     # double [m]   增加每级额外增加的搜索半径
search_adaptive_heuristic_step: 1.5     # double [-]   增加每级额外增加的启发值阈值
search_adaptive_radius_max:     50.0    # double [m]   增加搜索半径放宽上限
search_adaptive_heuristic_max:  20.0    # double [-]   增加启发值阈值放宽上限
search_adaptive_retry_on_short: true    # bool   [-]   当帧短路径时立即用更宽参数重算一次
loop_diag_enable:               false   # bool   [-]   打印几何回环诊断（way_size/首尾距/尾点到历史最小距）
curvature_lookahead_m:          5.0     # double [m]   前视曲率窗口：用窗口内最大曲率限速，提前入弯减速
decel_to_stop_at_end:           false   # bool   [-]   路径末端强制减速到 min_speed（循迹模式通常关闭）

# Replan flag
vital_num_midpoints:            10      # int    [num] 参与replan flag的前向关键点数量（更小=更少触发replan）

# Fail safe(s)                  #没搞明白,没问题建议别动
failsafe_max_way_horizon_size:  10      # int    [num] 增加故障安全时的路径大小
general_failsafe:               true    # bool   [-]   当没有可能找到一条不使用颜色的路径（路径长度小于一个常数）时，通用故障保护机制会自动将所有搜索参数增加一个因子。一旦使用正常参数计算出的路径长度足够长，它将切换回正常的功能。简单来说，这个设置项控制是否允许在无法找到足够长的不使用颜色的路径时，自动增加搜索参数来进行故障保护
general_failsafe_safetyFactor:  2.2     # double [-]   增加故障安全系数



perf_stats_enable: true   # bool   [-]     是否启用性能统计功能，启用后会记录每次规划的时间和路径长度等信息，方便调试和优化
perf_stats_window: 300     # int    [num]   性能统计的窗口大小，表示在计算平均性能指标时考虑的最近规划次数
perf_stats_log_every: 50   # int    [num]   每隔多少次规划记录一次性能统计信息到日志中，0表示不记录
