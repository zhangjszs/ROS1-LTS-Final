# FSD Visualization Config
# 可视化参数配置

# ========== 颜色配置 (RGBA 0.0~1.0) ==========
# 所有颜色均可通过 ROS Parameter 在运行时覆盖，无需重新编译。
# 格式为 [R, G, B, A] 数组，例如 [1.0, 0.0, 0.0, 1.0] 为纯红不透明。
# 若省略某项，则使用代码中的硬编码默认值。

colors:
  # --- 路径 ---
  path_center: [0.8, 0.0, 0.8, 1.0]      # 中心路径 (紫)
  path_partial: [0.0, 1.0, 0.0, 1.0]     # 部分路径 (绿)
  path_full: [0.0, 0.8, 0.8, 1.0]        # 完整路径 (青)
  boundary_left: [1.0, 1.0, 0.0, 0.8]    # 左边界 (黄)
  boundary_right: [0.0, 0.3, 1.0, 0.8]   # 右边界 (蓝)

  # --- 车辆 ---
  vehicle_body: [1.0, 1.0, 1.0, 0.9]     # 车身 CUBE (白，mesh 模式固定浅灰)
  vehicle_arrow: [0.0, 1.0, 0.0, 1.0]    # 航向箭头 (绿)
  vehicle_wheel: [0.2, 0.2, 0.2, 1.0]    # 车轮 (深灰，仅 CUBE 模式)
  vehicle_trail: [0.0, 0.8, 1.0, 0.7]    # 轨迹 (青，带渐变)
  vehicle_velocity: [1.0, 0.0, 0.5, 1.0] # 速度矢量 (品红)
  vehicle_steering: [1.0, 0.5, 0.0, 1.0] # 转向指示 (橙)

  # --- 三角剖分 ---
  tri_edge: [1.0, 0.0, 0.0, 0.6]         # 三角边 (红)
  tri_midpoint: [0.0, 1.0, 0.0, 1.0]     # 中点 (绿)
  computed_path: [0.8, 0.0, 0.8, 1.0]    # 计算路径 (紫)

  # --- 锥桶 ---
  cone_bbox: [1.0, 1.0, 1.0, 0.8]        # 聚类边界框 (白)
  cone_label: [1.0, 0.2, 0.2, 1.0]       # 距离标签 (红)

# =============================================

# 3D 网格模型
use_mesh: true
# 锥桶模型类型: "gazebo" (带纹理贴图) 或 "fssim" (分色 DAE)
cone_mesh_type: gazebo

# 锥桶
cone:
  radius: 0.15
  height: 0.30

# 置信度透明度
use_confidence_alpha: true
min_alpha: 0.3

# 路径
path:
  width: 0.08
  point_size: 0.10

# 车辆
vehicle:
  length: 2.8
  width: 1.4
  height: 0.5
  wheelbase: 1.55
  wheel_radius: 0.25
  wheel_width: 0.15

# 轨迹
trail:
  max_size: 200
  width: 0.05

# 三角剖分可视化
show_triangulation: true
show_circumcenters: false
show_midpoints: true
show_computed_path: true
